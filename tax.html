<!DOCTYPE html>
<html>
 <head>
    <title>Tax calculation</title>
    <h2>Parker Kennedy tax table computation</h2>
 </head>
<body>

<h2>Getting input</h2>

<form>
    <label for="income">Enter income </label>
    <input type ="number" id="income" name="Enter income" min=10 max=50 step=2 value=5000> <br>

    <label for="baseRate">Enter the base tax rate</label>
    <input type ="number" id="baseRate" value="0.05"> <br>

    <label for="cutoff">Enter the cut off</label>
    <input type="number" id="cutoff" value="7500"> <br>

    <label for="extRate">Enter the extended rate</label>
    <input type="number" id="extRate" value="0.15" step="0.01"> <br>

    <input type="button" onclick="doTax()" value="Show tax table">
</form>


<p id="result">taxes </p>
<form>
    <input type="radio" name="operation" value="exponent" onclick="chooseOp">
    <label>power</label> <br>

    <input type="radio" name="operation" value="add" onclick="chooseOp">
    <label>sum</label> <br>

    <input type="radio" name="operation" value="mod" onclick="chooseOp">
    <label>mod</label> <br>

</form>
<p id="Result"></p>

<script> 

function doTax(){
    let income = Number(document.getElementById("income").value)
    let cutoff = Number(document.getElementById("cutoff").value)
    let baseRate = Number(document.getElementById("baseRate").value)
    let extRate = Number(document.getElementById("extRate").value)

    let taxTable = "";
    for(let i = 1; i <= 5; i++){
        let incomeLevel = i * income;
        let tax = 0

        if(incomeLevel <= cutoff){
            tax = incomeLevel * baseRate;
        }
        else{
            tax = (cutoff * baseRate) + ((incomeLevel - cutoff) * extRate);
        }
        taxTable += "incomeLevel" + incomeLevel + " is " + tax + "; ";
    }
    document.getElementById("result").innerHTML =
    "Taxes are: " + taxTable;
}

function chooseOp(){
    let income = Number(document.getElementById("income").value)
    let baseRate = Number(document.getElementById("baseRate").value)
    let radios = document.getElementById("operation")

    let resultText = "";
    for(let i = 0; i < radios.length; i){
        if(radios[i].checked){
            if(radios[i].value === "exponent"){
                let value = income ** baseRate;
                resultText = income + " ^ " + baseRate + " is " + value;
            }
            else if(radios[i].value === "mod"){
                let value = income % baseRate;
                resultText = income + " % " + baseRate + " is " + value;
            }
        }
    }
document.getElementById("opResult").innerHTML = resultText;

}

</script>


</body>
</html>
