<!DOCTYPE html>
<html>
 <head>
    <title>
        villains web page
    </title>
    <h2>
        Villains by parker Kennedy
    </h2>
 </head>
<body>

<h2>Getting input</h2>

<form>
    <label for="secretvillain">Funny Man</label>
    <input type ="password" id="secretvillain" name="Joker" min=10 max=50 step=2 value=30> <br>

    <label for="guessvillain">guess the villain </label>
    <input type ="text" id="guessvillain" > <br>

    <input type="button" onclick="checkVillain()" value="check the guess">
</form>


<p id="result">caught: 0| gotAway: 0 </p>

<script> 
caught = 0;
gotAway = 0;

function checkVillain (){
    console.log("checking guess")
    secret = document.getElementById("secretvillain").value
    guess = document.getElementById("guessvillain").value
    

    if(secret == guess){
        caught++;
        alert("You caught them")
    } else {
        gotAway++;
        alert("maybe next time")
    }
}
</script>

</body>
</html>
