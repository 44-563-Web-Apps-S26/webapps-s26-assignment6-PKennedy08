<!DOCTYPE html>
<html>
 <head>
    <title>
        villains web page
    </title>
    <h2>
        Villains by parker Kennedy
    </h2>
 </head>
<body>

<h2>Getting input</h2>

<form>
    <label for="secretvillain">Funny Man</label>
    <input type ="password" id="secretvillain" name="Joker" min=10 max=50 step=2 value=30> <br>

    <label for="guessvillain">guess the villain </label>
    <input type ="text" id="guessvillain" > <br>

    <input type="button" onclick="checkVillain()" value="check the guess">
</form>


<p id="result">caught: 0 | gotAway: 0</p>

<script> 
caught = 0;
gotAway = 0;

function checkVillain (){
    console.log("checking guess")
    secret = document.getElementById("secretvillain").value
    guess = document.getElementById("guessvillain").value
    

    if(secret == guess){
        caught++;
        alert("You caught them")
    } else {
        gotAway++;
        alert("maybe next time")
    }
}
</script>

<br>

<div>
    <img id="TreeImage" src="https://www.tannins.org/wp-content/uploads/2019/05/quercia-tannino.jpg" width="150" height="150" class="img-fluid" alt="Druid Oak Tree" onclick="UpdatePicture()">
    
</div>
<script>
    let usepic = 1;

    function UpdatePicture(){
        let image = document.getElementById("TreeImage")

        switch(usepic){
            case 1:
                image.src = "https://www.tannins.org/wp-content/uploads/2019/05/quercia-tannino.jpg";
                usepic = 2;
                break;

            case 2:
                image.src = "https://i0.wp.com/thehorticult.com/wp-content/uploads/2014/03/Bloom-Alert-Coral-Tree-ryanbenoitphoto-thehorticult-RMB_88852.jpg?w=650&ssl=1";
                usepic = 3;
                break;
            case 3:
                image.src = "https://www.monumentaltrees.com/db/61/600/61952.jpg";
                usepic = 1;
                break;
        }

    }
</script>


</body>
</html>
